<head>

    <style>
        :root {
            --bg-color: #07080e;
            --card-bg: #101221cc;
            --border-color: #262a4a;
            --primary: #6d5efc;
            --primary-hover: #5b4be2;
            --accent: #3ee08f;
            --pink-accent: #ec4899;
            --text-main: #f2f3ff;
            --text-muted: #a3a8cf;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* Fondo con efectos de brillo (Glow) */
        .glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .glow i {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
        }
        .glow i:nth-child(1) {
            width: 50vmax; height: 50vmax;
            left: -15vmax; top: -15vmax;
            background: radial-gradient(closest-side, rgba(109, 94, 252, 0.5), transparent);
            animation: d1 14s ease-in-out infinite alternate;
        }
        .glow i:nth-child(2) {
            width: 45vmax; height: 45vmax;
            right: -15vmax; top: 25vh;
            background: radial-gradient(closest-side, rgba(236, 72, 153, 0.25), transparent);
            animation: d2 17s ease-in-out infinite alternate;
        }
        @keyframes d1 { to { transform: translate(6vmax, 6vmax); } }
        @keyframes d2 { to { transform: translate(-6vmax, -6vmax); } }

        /* Contenedor principal */
        .w {
            position: relative;
            z-index: 1;
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Navbar */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 22px;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #8b7cff, #4f8dff);
            border-radius: 11px;
            display: grid;
            place-items: center;
            color: white;
            font-size: 18px;
        }

        .logo-area b {
            color: var(--accent);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .cuban-flag {
            width: 30px;
            height: 20px;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            display: inline-block;
        }
        .flag-svg { width: 100%; height: 100%; }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 99px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: var(--transition);
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        /* Hero Section */
        .hero {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 40px;
            align-items: center;
            padding: 40px 0 70px;
        }

        .badge-tag {
            display: inline-block;
            background: linear-gradient(90deg, var(--primary), var(--pink-accent));
            padding: 6px 16px;
            border-radius: 99px;
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(32px, 5vw, 54px);
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 20px;
        }

        h1 span {
            background: linear-gradient(90deg, #a99cff, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .lead {
            color: var(--text-muted);
            font-size: clamp(16px, 2vw, 18px);
            margin-bottom: 30px;
        }

        .cta-group {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: white;
            box-shadow: 0 10px 30px rgba(109, 94, 252, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 35px rgba(109, 94, 252, 0.6);
        }

        .btn-outline {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
